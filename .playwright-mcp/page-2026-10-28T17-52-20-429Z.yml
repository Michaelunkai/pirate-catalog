blank\" href=\"https://en.riotpixels.com/games/reentry-a-space-flight-simulator/screenshots/14/?utm_source=emb-gfx-html&#038;utm_medium=image&#038;utm_campaign=rp-mass\" rel=\"noopener\"><img loading=\"lazy\" decoding=\"async\" width=\"178\" height=\"100\" border=\"0\" src=\"http://s01.riotpixels.net/data/23/43/2343590a-0c07-4ec7-8fda-c7194359a5b2.jpg.240p.jpg\"></a><a target=\"_blank\" href=\"https://en.riotpixels.com/games/reentry-a-space-flight-simulator/screenshots/6/?utm_source=emb-gfx-html&#038;utm_medium=image&#038;utm_campaign=rp-mass\" rel=\"noopener\"><img loading=\"lazy\" decoding=\"async\" width=\"178\" height=\"100\" border=\"0\" src=\"http://s01.riotpixels.net/data/c4/3b/c43b0082-deaa-42b7-81db-1eef5e7d353a.jpg.240p.jpg\"></a><a target=\"_blank\" href=\"https://en.riotpixels.com/games/reentry-a-space-flight-simulator/screenshots/1/?utm_source=emb-gfx-html&#038;utm_medium=image&#038;utm_campaign=rp-mass\" rel=\"noopener\"><img loading=\"lazy\" decoding=\"async\" width=\"178\" height=\"100\" border=\"0\" src=\"http://s01.riotpixels.net/data/c6/35/c6354ee9-41d8-4ee7-880a-7ce9a6fe27ad.jpg.240p.jpg\"></a><br /> <a target=\"_blank\" href=\"https://en.riotpixels.com/games/reentry-a-space-flight-simulator/screenshots/\" rel=\"noopener\"><video muted=\"\" preload=\"auto\" loop=\"\" autoplay=\"autoplay\" style=\"margin: 0px;display:block;width:534px\"><source src=\"https://video.fastly.steamstatic.com/store_trailers/882140/1431386228/9044e289cac96170c08a6c5a6c23e1536142c168/1759847029/microtrailer.webm\" type=\"video/webm\"></video></a></p> <h3>Repack Features</h3> <ul> <li>Based on Reentry.A.Space.Flight.Simulator.v1.1.2-RUNE ISO release: rune-reentry.a.space.flight.simulator.v1.1.2.iso (7,025,524,736 bytes) <li>Game version: v1.1.2 <li>100% Lossless &#038; MD5 Perfect: all files are identical to originals after installation <li>NOTHING ripped, NOTHING re-encoded <li>Smaller archive size (compressed from 6.5 to 4.4 GB) <li>Installation takes 3-6 minutes (depending on your system) <li>After-install integrity check so you could make sure that everything installed properly <li>HDD space after installation: 18.7 GB <li>Language can be changed in game settings <li>Repack uses XTool library by Razor12911 <li>At least 2 GB of free RAM (inc. virtual) required for installing this repack </ul> <div class=\"su-spoiler su-spoiler-style-fancy su-spoiler-icon-plus su-spoiler-closed\" data-scroll-offset=\"0\" data-anchor-in-url=\"no\"><div class=\"su-spoiler-title\" tabindex=\"0\" role=\"button\"><span class=\"su-spoiler-icon\"></span>Game Description</div><div class=\"su-spoiler-content su-u-clearfix su-u-trim\"> Reentry is a space flight simulator based on real life spacecrafts, and aims to meet the middle-ground between a simulator and a game. You create a new astronaut, gain levels and experience for every move you make by completing missions in space. You will have access to missions similar to what happened in real life, or fictional missions designed to challenge you as an astronaut.</p> <p>Spacecrafts are highly complicated machines with the primary task of exploring and understanding what&#8217;s outside the atmosphere of Earth, while keeping the astronauts alive for long periods. This is achieved by hundreds of individual systems and backup systems working together. With the help from the in-game Space Flight Academy, the provided flight manual for each spacecraft, and checklists, you will learn how to fly and operate these machines, and explore space in a high resolution and realistic environment.</p> <p>Control almost every system like the real astronauts, see the sunset and sunrise while orbiting Earth with speeds exceeding 25,500 ft/s. Explore the surface of Earth and the Moon, or simply enjoy the solitude of being in space.</p> <p>Imagine the final few seconds before launching into space. You are sitting on top of a 111 meter high rocket, looking at the instruments of a spaceship about to leave the oasis we call Earth. The engines are igniting, mechanical systems are clinging below you, while thousands of gallons of fuel is pumping through the systems. The loud roar of the five F1 engines are producing close to 8,000,000 pounds of thrust, violently shaking the cockpit and lifting 3 million kg off the pad. The launch pad tower is slowly moving away from you while the engines are balancing the rocket like a skyscraper on a needle. Sophisticated engineers has created the systems that will safely accelerate you to 25,500 ft/s, into a free fall orbit, with the Moon as the destination.</p> <p>Welcome to Reentry, a space flight simulator.<br /> </div></div> <p><B>Backwards Compatibility</B></p> <p>This repack IS NOT backwards compatible with my previous Reentry repack.</p> <p>The post <a href=\"https://fitgirl-repacks.site/reentry-a-space-flight-simulator/\">Reentry: A Space Flight Simulator &#8211; v1.1.2</a> appeared first on <a href=\"https://fitgirl-repacks.site\">FitGirl Repacks</a>.</p> ]]></content:encoded> <wfw:commentRss>https://fitgirl-repacks.site/reentry-a-space-flight-simulator/feed/</wfw:commentRss> <slash:comments>0</slash:comments> <enclosure url=\"https://video.fastly.steamstatic.com/store_trailers/882140/1431386228/9044e289cac96170c08a6c5a6c23e1536142c168/1759847029/microtrailer.webm\" length=\"1281311\" type=\"video/webm\" /> <post-id xmlns=\"com-wordpress:feed-additions:1\">69004</post-id> </item> </channel> </rss> <!-- Performance optimized by W3 Total Cache. Learn more: https://www.boldgrid.com/w3-total-cache/?utm_source=w3tc&utm_medium=footer_comment&utm_campaign=free_plugin Object Caching 37/41 objects using Redis Page Caching using Redis Database Caching 2/3 queries in 0.001 seconds using Redis Served from: fitgirl-repacks.site @ 2026-10-28 19:53:41 by W3 Total Cache -->"