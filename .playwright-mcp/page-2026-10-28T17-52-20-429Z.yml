ly <li>HDD space after installation: up to 121.6 GB <li>Language can be changed in &#8220;engine\\source\\bin\\x64\\tenoke.ini&#8221; file <li>Repack uses XTool library by Razor12911 <li>At least 2 GB of free RAM (inc. virtual) required for installing this repack </ul> <div class=\"su-spoiler su-spoiler-style-fancy su-spoiler-icon-plus su-spoiler-closed\" data-scroll-offset=\"0\" data-anchor-in-url=\"no\"><div class=\"su-spoiler-title\" tabindex=\"0\" role=\"button\"><span class=\"su-spoiler-icon\"></span>Game Description</div><div class=\"su-spoiler-content su-u-clearfix su-u-trim\"> Over twenty years ago in Harran, we fought the virus—and lost. Now, we’re losing again. The City, one of the last large human settlements, is torn by conflict. Civilization has fallen back into the Dark Ages. And yet, we still have hope.</p> <p>You are a wanderer with the power to change the fate of The City. But your exceptional abilities come at a price. Haunted by memories you cannot decipher, you set out to learn the truth… and find yourself in a combat zone. Hone your skills, as to defeat your enemies and make allies, you’ll need both fists and wits. Unravel the dark secrets behind the wielders of power, choose sides and decide your destiny. But wherever your actions take you, there&#8217;s one thing you can never forget—stay human.</p> <p><b>Game Features</b></p> <ul> <li><b>VAST OPEN WORLD:</b> Participate in the life of a city engulfed in a new dark era. Discover different paths and hidden passages, as you explore its multiple levels and locations. <li><b>CREATIVE &#038; BRUTAL COMBAT:</b> Take advantage of your parkour skills to tip the scales of even the most brutal encounter. Clever thinking, traps and creative weapons will be your best friends. <li><b>DAY AND NIGHT CYCLE:</b> Wait for night to venture into dark hideouts of the Infected. Sunlight keeps them at bay, but once it’s gone, monsters begin the hunt, leaving their lairs free to explore. <li><b>CHOICES &#038; CONSEQU