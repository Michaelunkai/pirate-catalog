                - generic [ref=f15e723]: 
                - text: Game Description
              - generic:
                - text: Explore, navigate, and uncover the vast wilderness of over the hill, the newest installation from the creator of art of rally. Ramble your way through varied biomes inspired by real-world locations, from valleys to mountains and everything in between.
                - paragraph
                - paragraph: Take to the trails solo or with up to three friends. Cruise through scenic landscapes, tackle challenging off-road routes, and work together to overcome the obstacles standing between you and your destination.
                - paragraph: Different situations call for different solutions. Use planks to cross gaps, deploy winches to recover vehicles and navigate difficult terrain, and bring the right equipment to help you overcome the challenges ahead. Whether you’re carefully planning your route or improvising your way through a tricky situation, the journey is always in your hands.
                - paragraph: Explore forests, lakesides, and mountains as you uncover remote cabins, scenic viewpoints, natural landmarks, meteorites that have fallen from the sky, and portals that can take you to new areas. Dynamic weather and day/night cycles can transform the world around you and change the conditions of your journey.
                - paragraph: Spot native wildlife and use the in-game camera to document your discoveries. Photograph the animals you encounter to fill out your wildlife compendium, or stop to capture an awe-inspiring landscape, a beautiful sunset, or any other moment worth remembering.
                - paragraph: Find upgrades and equipment throughout the world to help you take on the terrain ahead. Stop at merchants and cabins to customize your vehicle with colours, accessories, and cosmetics that suit your driving style.
                - paragraph: This is a driving game, not a racing game. Take your time, enjoy the drive, find your own route, and see where the road leads. The best stories never start at the end.
