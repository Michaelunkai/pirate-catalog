            - generic [ref=f15e820]:
              - button " Game Description" [ref=f15e821] [cursor=pointer]:
                - generic [ref=f15e822]: 
                - text: Game Description
              - generic:
                - text: USSR, 1987. Six volunteers are hooked up to ASPIS — an experimental system designed to predict historical events. One year later, not a single one has woken up.
                - paragraph
                - paragraph: Among them is Andrey, an engineer who agreed to the experiment for a single chance to see his deceased wife, Anna, and daughter, Liza, once more. But instead of generating a controlled simulation, ASPIS opens a path to places its creators never intended to reach.
                - paragraph: "Andrey’s journey begins at the Institute of Cybernetics and gradually leads him far from familiar reality: toward distorted versions of recognizable places, ancient structures, and worlds that existed long before ASPIS was ever launched."
                - paragraph: Explore the environment, find documents and records, interface with OGAS terminals, and piece together the events of the experiment. The story unfolds gradually through the world itself, character encounters, and cinematic scenes.
                - paragraph: "Exploration eventually gives way to chases and confrontations. The Guardian cannot simply be shot and killed: it pursues Andrey through corridors and rooms, forcing him to keep moving and find a way out under constant pressure."
                - paragraph: Other opponents can be fought using a Makarov pistol and melee combat, while ammunition and other resources must be found along the way.
                - paragraph: "The PEP-01 allows you to interact with Energy X: capturing and transferring it, powering machinery, and changing the state of specific mechanisms."
                - paragraph: With its help, Andrey also opens astral windows between different layers of reality. Objects unreachable in one state of the world can be seen and extracted from another, using this mechanic for exploration and solving spatial puzzles.
                - paragraph: Andrey is not alone inside ASPIS. Along the way, he encounters other volunteers, the Institute Director, and beings who seem far more familiar with the worlds opened by the machine than Andrey is.
                - paragraph: A talking Cat knows the ancient pathways and clearly understands what is happening better than he is willing to share. In one of the worlds, Andrey also meets the Devil — but none of them gives Andrey the whole picture.
                - paragraph: The further Andrey goes, the more deeply the experiment becomes tied to the reason he agreed to enter ASPIS in the first place.
                - paragraph: In the finale, the player will have to make a single choice that will determine Andrey’s fate and lead to one of two endings.
