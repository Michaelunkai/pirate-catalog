              - generic:
                - text: The Azure Striker’s journey, all 3 games in one collection!
                - paragraph
                - paragraph: The Azure Striker Gunvolt Trilogy Enhanced is a collection of three traditional 2D action platformers,
                - paragraph: “Azure Striker Gunvolt” (2014), “Azure Striker Gunvolt 2” (2016), and “Azure Striker Gunvolt 3” (2022)
                - paragraph: together in one release, complete with all DLC.
                - paragraph: The Gunvolt series boasts a rich story, played out with real-time dialog during missions, and an vast catalog of music, with over 37 songs performed by the games’ characters.
                - paragraph: "Plus, this special Trilogy comes with exclusive features: action revisions from the series director, revised voices and songs, and once Japan-exclusive CD dramas included in the game. This collection strives to be as complete as possible!"
                - paragraph: Included Games
                - paragraph: "Azure Striker Gunvolt: Dash through stages at high speed and take down enemies with your “Flashfield” in this satisfying action platformer."
                - paragraph: Players control Gunvolt, a superhuman (known as an Adept) with the power of lightning who must confront the oppressive Sumeragi Group in a battle for freedom.
                - paragraph: The Trilogy Enhanced version adds new Skills to Gunvolt’s arsenal.
                - paragraph: Unleash overwhelming power like never before!
                - paragraph: "Azure Striker Gunvolt 2: Gunvolt’s rival, Copen, becomes a new star and playable character alongside the Azure Striker."
                - paragraph: Copen uses his dash to tackle and lock onto enemies before unleashing a devastating homing laser barrage.
                - paragraph: Master his aerial “Bullit Dash” to gracefully fly through stages and destroy enemies from above, unlocking new weapons from the abilities of defeated bosses.
                - paragraph: Copen and Lola’s voices have been re-recorded for the Trilogy Enhanced edition of the game.
                - paragraph: "Azure Striker Gunvolt 3: A new style of action arrives with the new heroine “Kirin” who can swap with Gunvolt to overcome any situation."
                - paragraph: Kirin has the power to teleport instantly to strike down enemies with her “Arc Chain” ability for melee action of unprecedented speed. Or switch to Gunvolt, whose tag and electrify style has leveled up to allow him to dash through enemies while striking them down, teleport, and unleash other new “Voltaic Arts”.
                - paragraph: The Image Pulse system brings characters from the series as buffs and attacks, with over 150 varieties to collect.
