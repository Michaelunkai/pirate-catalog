                - heading "Is Codexgames official?" [level=3] [ref=f42e345]
                - paragraph [ref=f42e346]: No. Codexgames is an independent fan companion. It is not affiliated with, endorsed by, or an official product of the publishers or studios behind the games listed here — including any games added later. Trademarks belong to their respective owners.
